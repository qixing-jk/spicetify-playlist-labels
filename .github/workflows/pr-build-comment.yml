name: pr-build

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Build dist
        id: build
        run: npm run build:ci

      - name: Comment build result
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BUILD_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup-node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        with:
          script: |
            const marker = '<!-- pr-build-status -->';
            const status = process.env.BUILD_STATUS === 'success' ? 'success' : 'failure';
            const statusLabel = status === 'success' ? 'Build succeeded' : 'Build failed';
            const statusEmoji = status === 'success' ? '✅' : '❌';

            const stepOutcomes = [
              ['Checkout', process.env.CHECKOUT_OUTCOME],
              ['Setup Node.js', process.env.SETUP_NODE_OUTCOME],
              ['Install dependencies', process.env.INSTALL_OUTCOME],
              ['Build dist', process.env.BUILD_OUTCOME],
            ];

            const failedSteps = stepOutcomes.filter(
              ([, outcome]) => outcome && outcome !== 'success' && outcome !== 'skipped',
            );

            const failedStepsLine = failedSteps.length
              ? `- Failed steps: ${failedSteps
                  .map(([name, outcome]) => `\`${name}\` (${outcome})`)
                  .join(', ')}\n`
              : '';

            const body = `${marker}
            ## PR Build Result ${statusEmoji}

            - Status: ${statusLabel}
            - Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\`
            - Workflow run: [#${process.env.RUN_NUMBER}](${process.env.RUN_URL})
            - Commands: \`npm ci --no-audit --no-fund\`, \`npm run build:ci\`
            ${failedStepsLine}`.replace(/^ {12}/gm, '').trim();

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existingComment = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
